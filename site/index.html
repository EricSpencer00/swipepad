<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwipeType.app</title>
<meta name="description" content="Swipe to type on your MacBook trackpad.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--black:oklch(0 0 0);--white:oklch(1 0 0);--dim:oklch(0.5 0 0);--hair:oklch(0.22 0 0);
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",monospace;--ease:cubic-bezier(0.16,1,0.3,1)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--black);color:var(--white);font-family:var(--mono);overflow:hidden}
.intro{position:fixed;inset:0;display:grid;place-items:center;padding:24px;transition:opacity .7s var(--ease)}
.intro.gone{opacity:0;pointer-events:none}
.laptop{width:min(92vw,640px);height:auto;display:block;transition:opacity .6s var(--ease),transform .6s var(--ease)}
.laptop.gone{opacity:0;transform:scale(.98)}
.laptop .ink{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.laptop .pad-ink{fill:none;stroke:rgba(255,255,255,.45);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.title{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .8s var(--ease)}
.title.on{opacity:1}
.title.away{opacity:0}
.title h1{margin:0;font:500 clamp(44px,11vw,104px)/1 var(--mono);letter-spacing:-.01em;white-space:nowrap}
.title h1 span{color:var(--dim)}
.content{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;
  opacity:0;transform:translateY(8px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.content.on{opacity:1;transform:none}
.cta{display:inline-block;padding:16px 34px;border:1px solid var(--white);color:var(--white);text-decoration:none;
  font:500 15px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;transition:background .2s,color .2s}
.cta:hover{background:var(--white);color:var(--black)}
.cta:focus-visible{outline:2px solid var(--white);outline-offset:4px}
.source{position:absolute;bottom:28px;left:0;right:0;font-size:13px;letter-spacing:.04em}
.source a{color:var(--dim);text-decoration:none;transition:color .2s}
.source a:hover{color:var(--white)}
@media (prefers-reduced-motion: reduce){*{transition-duration:0s!important}}
</style>
</head>
<body>
<main class="intro" id="intro" aria-hidden="true">
  <svg class="laptop" id="laptop" viewBox="0 0 1200 900" role="img" aria-label="A MacBook with the SwipeType keyboard on screen and a trackpad below">
    <!-- lid -->
    <rect x="220" y="40" width="760" height="500" rx="26" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="3"/>
    <rect x="248" y="72" width="704" height="436" rx="6" fill="#000" stroke="#161616" stroke-width="2"/>
    <!-- on-screen keyboard: canvas 560 x 213, centred on the display -->
    <g class="keys" id="keys"></g>
    <path class="ink" id="screen-ink" d=""/>
    <!-- base and trackpad -->
    <rect x="150" y="540" width="900" height="330" rx="34" fill="#0c0c0c" stroke="#2a2a2a" stroke-width="3"/>
    <rect x="420" y="600" width="360" height="248" rx="18" fill="#080808" stroke="#2c2c2c" stroke-width="2"/>
    <path class="pad-ink" id="pad-ink" d=""/>
  </svg>
</main>

<div class="title" id="title" aria-hidden="true"><h1>SwipeType<span>.app</span></h1></div>

<section class="content" id="content">
  <a class="cta" href="https://github.com/EricSpencer00/swipepad/releases">Download</a>
  <div class="source"><a href="https://github.com/EricSpencer00/swipepad">GitHub</a></div>
</section>

<script>
const NS="http://www.w3.org/2000/svg";
// Keyboard geometry as in the app overlay: bottom-left origin, columns 0.1 apart, rows at 0.8 / 0.5 / 0.2.
const rows=[["q","w","e","r","t","y","u","i","o","p"],["a","s","d","f","g","h","j","k","l"],["z","x","c","v","b","n","m"]];
const offs=[0,0.5,1.5],ys=[0.8,0.5,0.2];
const keyPos={};rows.forEach((r,ri)=>r.forEach((k,i)=>keyPos[k]=[(i+offs[ri]+0.5)/10,ys[ri]]));
// On-screen canvas (app: 1 : 0.38) and trackpad (about 1.45 : 1), in SVG units.
const CANVAS={x:320,y:270,w:560,h:213};
const PAD={x:420,y:600,w:360,h:248};
const toScreen=(p)=>[CANVAS.x+p[0]*CANVAS.w,CANVAS.y+(1-p[1])*CANVAS.h];
const toPad=(p)=>[PAD.x+p[0]*PAD.w,PAD.y+(1-p[1])*PAD.h];

const keysG=document.getElementById('keys');
const keyEls={};
const keyW=CANVAS.w/10*0.86, keyH=CANVAS.h/3*0.68;
rows.forEach((r,ri)=>r.forEach((k,i)=>{
  const [x,y]=toScreen(keyPos[k]);
  const g=document.createElementNS(NS,'g');
  const rect=document.createElementNS(NS,'rect');
  rect.setAttribute('x',x-keyW/2);rect.setAttribute('y',y-keyH/2);rect.setAttribute('width',keyW);rect.setAttribute('height',keyH);
  rect.setAttribute('rx',9);rect.setAttribute('fill','#161616');rect.setAttribute('stroke','#3a3a3a');rect.setAttribute('stroke-width','1.5');
  const text=document.createElementNS(NS,'text');
  text.setAttribute('x',x);text.setAttribute('y',y+6);text.setAttribute('text-anchor','middle');
  text.setAttribute('font-family','IBM Plex Mono, monospace');text.setAttribute('font-size','18');text.setAttribute('font-weight','500');
  text.setAttribute('fill','#c8c8c8');text.textContent=k.toUpperCase();
  g.appendChild(rect);g.appendChild(text);keysG.appendChild(g);
  keyEls[k]={g,rect,text,x,y,at:700+(ri*10+i)*40};
}));

// The thumb's path: a slightly human circle, drawn on the trackpad and on the screen at once.
const N=260, OVERSHOOT=1.07;
const circle=[];
for(let i=0;i<=N;i++){
  const s=OVERSHOOT*i/N;                                  // progress around the circle
  const th=-Math.PI/2+2*Math.PI*(s+0.02*Math.sin(2*Math.PI*s)); // uneven speed, like a real hand
  const rx=0.40*(1+0.025*Math.sin(3*th)), ry=0.29*(1+0.03*Math.cos(2*th));
  circle.push([0.5+rx*Math.cos(th),0.5+ry*Math.sin(th)]);
}
function pathFor(points,map){return 'M'+points.map(p=>map(p).map(v=>v.toFixed(1)).join(' ')).join(' L');}
function lengthsOf(points,map){
  const q=points.map(map),cum=[0];
  for(let i=1;i<q.length;i++)cum.push(cum[i-1]+Math.hypot(q[i][0]-q[i-1][0],q[i][1]-q[i-1][1]));
  return {cum,total:cum[cum.length-1]};
}
const screenInk=document.getElementById('screen-ink'), padInk=document.getElementById('pad-ink');
const screenLen=lengthsOf(circle,toScreen), padLen=lengthsOf(circle,toPad);
screenInk.setAttribute('d',pathFor(circle,toScreen));screenInk.setAttribute('stroke-dasharray',screenLen.total);
padInk.setAttribute('d',pathFor(circle,toPad));padInk.setAttribute('stroke-dasharray',padLen.total);

// Timeline (ms): laptop in, keys pop in, circle drawn, keys out, laptop out, title, content.
const T={laptopIn:0,keysIn:700,circleStart:1500,circleEnd:4300,keysOut:4600,laptopOut:5000,titleIn:5400,titleOut:7100,contentIn:7700};
const laptop=document.getElementById('laptop'),intro=document.getElementById('intro');
const title=document.getElementById('title'),content=document.getElementById('content');
const ease=t=>t<0?0:t>1?1:0.5-0.5*Math.cos(Math.PI*t);
// Progress around the circle, eased at both ends so the thumb settles, then runs.
function progressAt(t){
  if(t<=T.circleStart)return 0;
  if(t>=T.circleEnd)return 1;
  return ease((t-T.circleStart)/(T.circleEnd-T.circleStart));
}
function pointAt(len,p){
  const target=len.total*p;let lo=0,hi=len.cum.length-1;
  while(hi-lo>1){const m=(lo+hi)>>1;if(len.cum[m]<=target)lo=m;else hi=m;}
  return {drawn:target,lo};
}
const t0=performance.now();
function frame(now){
  const t=now-t0;
  laptop.classList.toggle('gone',t>=T.laptopOut);
  intro.classList.toggle('gone',t>=T.laptopOut+500);
  const p=progressAt(t);
  const drawn=p*screenLen.total;
  screenInk.setAttribute('stroke-dashoffset',screenLen.total-drawn);
  padInk.setAttribute('stroke-dashoffset',padLen.total-p*padLen.total);
  // keys pop in as they're needed, then fade with the rest
  const out=t>=T.keysOut?Math.max(0,1-(t-T.keysOut)/400):1;
  Object.values(keyEls).forEach(k=>{
    const f=Math.max(0,Math.min(1,(t-k.at)/300)),e=1-Math.pow(1-f,3);
    k.g.style.opacity=e*out;
    k.g.style.transform=`translate(0,${(1-e)*10}px)`;
  });
  // light the key under the thumb's trail head
  if(p>0&&p<1){
    const idx=Math.min(circle.length-1,Math.floor(p*(circle.length-1)));
    const head=toScreen(circle[idx]);
    let best=null,bd=Infinity;
    Object.entries(keyEls).forEach(([key,k])=>{const d=Math.hypot(k.x-head[0],k.y-head[1]);if(d<bd){bd=d;best=key;}});
    Object.entries(keyEls).forEach(([key,k])=>{const lit=key===best&&bd<keyW*0.7;k.rect.setAttribute('fill',lit?'#fff':'#161616');k.text.setAttribute('fill',lit?'#000':'#c8c8c8');});
  }
  if(t>=T.titleIn)title.classList.add('on');
  if(t>=T.titleOut){title.classList.remove('on');title.classList.add('away');}
  if(t>=T.contentIn)content.classList.add('on');
  if(t<T.contentIn+1000)requestAnimationFrame(frame);
}
if(matchMedia('(prefers-reduced-motion: reduce)').matches){
  intro.classList.add('gone');content.classList.add('on');
}else requestAnimationFrame(frame);
</script>
</body>
</html>
