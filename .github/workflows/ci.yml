name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build and run checks (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build package
        run: swift build

      - name: Run checks
        run: swift run SwipepadChecks

      - name: Build app bundle
        run: ./scripts/build-app.sh
